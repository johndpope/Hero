name: flutter_hero_transitions_example
description: Example app demonstrating flutter_hero_transitions with 100% iOS Hero parity.
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_hero_transitions:
    path: ../
  video_player: ^2.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/foods/
    - assets/city_guide/
    - assets/apple_home_page/
    - assets/icons/
    - assets/menu/
    - assets/music_player/
